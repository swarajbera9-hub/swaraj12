<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Page</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(16px) scale(0.98)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Glassmorphism card styling */
        .glass-card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        /* Glassmorphism badge styling */
        .glass-badge {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
        }

        /* Soft typography glowing effect */
        .text-glow {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3), 0 4px 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="h-full w-full bg-slate-950 text-white font-sans overflow-hidden select-none">

    <!-- Full-screen background image container -->
    <div class="fixed inset-0 z-0 overflow-hidden">
        <img src="1723125173345_3.jpg" 
             alt="Background Image" 
             class="w-full h-full object-cover object-center scale-105 transition-transform duration-1000 ease-out" />
        
        <!-- Subtle dark gradient overlay for visual balance and high text legibility -->
        <div class="absolute inset-0 bg-gradient-to-b from-slate-950/40 via-slate-950/25 to-slate-950/65"></div>
    </div>

    <!-- Main page wrapper -->
    <div class="relative z-10 min-h-screen flex flex-col justify-between items-center px-4 py-8 sm:px-8 sm:py-12">
        
        <!-- Top Spacer for balanced vertical placement -->
        <div class="w-full max-w-xl h-8 opacity-0"></div>

        <!-- Center Content Card -->
        <main class="w-full max-w-2xl mx-auto my-auto animate-fade-in">
            <div class="glass-card rounded-3xl p-8 sm:p-14 text-center transform transition-all duration-500 hover:border-white/30">
                <h1 class="text-3xl sm:text-5xl md:text-6xl font-display font-bold text-white tracking-tight leading-tight text-glow">
                    This is an private page
                </h1>
            </div>
        </main>

        <!-- Bottom Subtext Badge -->
        <footer class="w-full flex justify-center pb-2 sm:pb-4 animate-fade-in" style="animation-delay: 200ms;">
            <div class="glass-badge inline-flex items-center gap-2.5 px-5 py-2.5 rounded-full text-xs sm:text-sm font-medium text-slate-200 tracking-wide transition-all duration-300 hover:scale-105">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span>Something Special Coming Soon.</span>
            </div>
        </footer>

    </div>

</body>
</html>
